version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sat_sa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sat_sa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_supervisory_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sat_sa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sat_sa_admin -d sat_sa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sat_sa_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sat_sa_admin}:${POSTGRES_PASSWORD:-secure_supervisory_pass_2026}@postgres:5432/${POSTGRES_DB:-sat_sa_db}
      JWT_SECRET: ${JWT_SECRET:-sat_sa_nciipc_supervisory_secret_2026}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sat_sa_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
